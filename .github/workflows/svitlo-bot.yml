   name: svitlo-bot

   on:
     schedule:
       - cron: "*/5 * * * *"
     workflow_dispatch:

   concurrency:
     group: svitlo-bot
     cancel-in-progress: false

   permissions:
     contents: read

   jobs:
     check:
       runs-on: ubuntu-latest
       timeout-minutes: 5
       steps:
         - uses: actions/checkout@v4

         - name: Restore state
           uses: actions/cache/restore@v4
           with:
             path: state.json
             key: svitlo-state-${{ github.run_id }}
             restore-keys: svitlo-state-

         - name: Check schedules
           env:
             BOT_CONFIG: ${{ secrets.BOT_CONFIG }}
           run: python3 bot.py --once

         - name: Save state
           if: always()
           uses: actions/cache/save@v4
           with:
             path: state.json
             key: svitlo-state-${{ github.run_id }}
